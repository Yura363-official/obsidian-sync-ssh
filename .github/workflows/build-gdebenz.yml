name: Build GdeBenz app (Android / iOS / Windows / Linux)

on:
  push:
    branches:
      - claude/gdebenz-multiplatform-app-4qqs9a
      - main
    paths:
      - "gdebenz-app/**"
      - ".github/workflows/build-gdebenz.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: gdebenz-app

jobs:
  linux:
    name: Linux (AppImage + deb + rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gdebenz-app/src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm install

      - name: Generate icons
        run: npx tauri icon app-icon.png

      - name: Build
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: GdeBenz-linux
          path: |
            gdebenz-app/src-tauri/target/release/bundle/appimage/*.AppImage
            gdebenz-app/src-tauri/target/release/bundle/deb/*.deb
            gdebenz-app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows:
    name: Windows (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gdebenz-app/src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Generate icons
        run: npx tauri icon app-icon.png

      - name: Build
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: GdeBenz-windows
          path: |
            gdebenz-app/src-tauri/target/release/bundle/nsis/*.exe
            gdebenz-app/src-tauri/target/release/bundle/msi/*.msi
            gdebenz-app/src-tauri/target/release/GdeBenz.exe
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "Using preinstalled NDK: $ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gdebenz-app/src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Init Android project
        run: npx tauri android init

      - name: Generate icons
        run: npx tauri icon app-icon.png

      - name: Build APK
        run: npx tauri android build --apk

      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          UNSIGNED=$(find src-tauri/gen/android -name "*-unsigned.apk" | head -1)
          echo "Unsigned APK: $UNSIGNED"
          keytool -genkeypair -keystore ks.jks -alias gdebenz -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass gdebenz123 -keypass gdebenz123 \
            -dname "CN=GdeBenz, O=GdeBenz, C=RU"
          "$BT/zipalign" -f 4 "$UNSIGNED" GdeBenz-aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:gdebenz123 \
            --out GdeBenz.apk GdeBenz-aligned.apk
          "$BT/apksigner" verify GdeBenz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GdeBenz-android-apk
          path: gdebenz-app/GdeBenz.apk
          if-no-files-found: error

  ios:
    name: iOS (IPA, без подписи)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gdebenz-app/src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Init iOS project
        run: npx tauri ios init

      - name: Generate icons
        run: npx tauri icon app-icon.png

      - name: Build Rust library for iOS
        run: cargo build --manifest-path src-tauri/Cargo.toml --lib --release --target aarch64-apple-ios

      - name: Disable Xcode Rust build phase (lib is prebuilt)
        run: |
          python3 - <<'EOF'
          import glob
          p = glob.glob('src-tauri/gen/apple/*.xcodeproj/project.pbxproj')[0]
          s = open(p).read()
          needle = 'npm run -- tauri ios xcode-script'
          assert needle in s, 'xcode-script phase not found in ' + p
          s = s.replace(needle, 'true || npm run -- tauri ios xcode-script')
          open(p, 'w').write(s)
          print('patched', p)
          EOF

      - name: Build .app without code signing
        run: |
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
          echo "Project: $PROJ"
          SCHEME=$(xcodebuild -project "$PROJ" -list -json | \
            jq -r '.project.schemes[] | select(test("_iOS$"))' | head -1)
          echo "Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release \
            -sdk iphoneos -derivedDataPath xcbuild \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(ls -d xcbuild/Build/Products/*-iphoneos/*.app | head -1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry GdeBenz-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GdeBenz-ios-ipa
          path: gdebenz-app/GdeBenz-unsigned.ipa
          if-no-files-found: error
